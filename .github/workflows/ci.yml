name: Persona Team CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell syntax
        run: bash -n scripts/persona.sh scripts/install.sh tests/test_persona.sh
      - name: Validate templates
        run: python3 tests/validate_repository.py
      - name: Run macOS integration tests
        run: ./tests/test_persona.sh
